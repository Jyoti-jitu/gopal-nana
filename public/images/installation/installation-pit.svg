<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <defs>
    <linearGradient id="soilGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9A3412"/><stop offset="50%" stop-color="#78350F"/><stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <linearGradient id="cuRodGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B85B28"/><stop offset="40%" stop-color="#F7C4A1"/><stop offset="100%" stop-color="#732B08"/>
    </linearGradient>
    <linearGradient id="compoundFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Deep Earth Soil Background -->
  <rect width="600" height="700" rx="16" fill="url(#soilGrad)"/>

  <!-- Soil Texture Details -->
  <g fill="#571E06" opacity="0.4">
    <circle cx="80" cy="100" r="25"/><circle cx="520" cy="150" r="35"/><circle cx="120" cy="300" r="40"/><circle cx="480" cy="450" r="30"/>
    <circle cx="90" cy="580" r="35"/><circle cx="500" cy="620" r="20"/>
  </g>

  <!-- Excavated Central Hole -->
  <rect x="220" y="80" width="160" height="580" fill="#1E293B" rx="8" stroke="#0F172A" stroke-width="4"/>

  <!-- Backfill Compound Filling Layer -->
  <rect x="230" y="140" width="140" height="510" fill="url(#compoundFill)" opacity="0.85" rx="4"/>

  <!-- Forecast Earthing Electrode Rod -->
  <rect x="285" y="40" width="30" height="600" fill="url(#cuRodGrad)" rx="4"/>

  <!-- Wire Connection Conductor Line -->
  <path d="M 300 100 Q 150 80 40 120" fill="none" stroke="#22C55E" stroke-width="8" stroke-linecap="round"/>

  <!-- Worker Hands / Installation Equipment Graphic -->
  <g transform="translate(180, 20)">
    <rect x="80" y="0" width="80" height="50" fill="#D90429" rx="6"/>
    <text x="120" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">FORECAST ROD</text>
  </g>
</svg>
