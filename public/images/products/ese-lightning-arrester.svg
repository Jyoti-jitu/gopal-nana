<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0F172A"/><stop offset="100%" stop-color="#1E293B"/></linearGradient>
    <linearGradient id="steelMetal" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#94A3B8"/><stop offset="25%" stop-color="#F1F5F9"/><stop offset="50%" stop-color="#FFFFFF"/><stop offset="75%" stop-color="#CBD5E1"/><stop offset="100%" stop-color="#64748B"/></linearGradient>
    <linearGradient id="goldAccent" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FFB703"/><stop offset="100%" stop-color="#FB8500"/></linearGradient>
  </defs>

  <rect width="600" height="500" rx="16" fill="url(#bgGrad)"/>
  <rect x="30" y="30" width="130" height="28" rx="6" fill="#D90429"/>
  <text x="95" y="49" font-family="Arial" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">CODE: 9-FELA</text>

  <!-- Technical Grid -->
  <g opacity="0.1" stroke="#FFFFFF" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="500"/><line x1="300" y1="0" x2="300" y2="500"/><line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="0" y1="150" x2="600" y2="150"/><line x1="0" y1="350" x2="600" y2="350"/>
  </g>

  <!-- ESE Arrester Graphics -->
  <g transform="translate(180, 20)">
    <!-- Central Sharp Stainless Steel Air Terminal Rod -->
    <polygon points="120,20 125,180 115,180" fill="url(#steelMetal)"/>
    
    <!-- ESE Ion Generator Collector Head (304L Steel) -->
    <path d="M 60 180 L 180 180 L 150 290 L 90 290 Z" fill="url(#steelMetal)" stroke="#334155" stroke-width="2"/>
    <rect x="80" y="220" width="80" height="30" rx="4" fill="#0F172A"/>
    <text x="120" y="240" font-family="Arial" font-size="11" font-weight="bold" fill="url(#goldAccent)" text-anchor="middle">ΔT = 60 μs</text>

    <!-- Support Shaft -->
    <rect x="105" y="290" width="30" height="150" fill="url(#steelMetal)"/>

    <!-- Lightning Rays Animation Graphic -->
    <path d="M 120 20 L 70 -30 L 95 -30 L 50 -80 L 120 0 L 110 -25 Z" fill="#FFB703" opacity="0.8" transform="translate(0, 40)"/>
    <path d="M 120 20 L 170 -30 L 145 -30 L 190 -80 L 120 0 L 130 -25 Z" fill="#FFB703" opacity="0.8" transform="translate(0, 40)"/>
  </g>

  <!-- Spec Callout Badges -->
  <g font-family="Arial" font-size="12" font-weight="600">
    <rect x="400" y="100" width="170" height="36" rx="6" fill="#1E293B" stroke="#D90429"/>
    <text x="485" y="122" text-anchor="middle" fill="#FFFFFF">NFC 17-102 (2011) Tested</text>

    <rect x="400" y="180" width="170" height="36" rx="6" fill="#1E293B" stroke="#FFB703"/>
    <text x="485" y="202" text-anchor="middle" fill="#FFFFFF">304L Stainless Steel</text>

    <rect x="400" y="260" width="170" height="36" rx="6" fill="#1E293B" stroke="#38BDF8"/>
    <text x="485" y="282" text-anchor="middle" fill="#FFFFFF">No Battery / Autonomous</text>
  </g>
</svg>
