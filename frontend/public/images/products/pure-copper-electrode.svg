<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/><stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="pureCu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B85B28"/><stop offset="25%" stop-color="#F7C4A1"/><stop offset="50%" stop-color="#FFFFFF"/><stop offset="75%" stop-color="#F7C4A1"/><stop offset="100%" stop-color="#8C3A10"/>
    </linearGradient>
  </defs>

  <rect width="600" height="500" rx="16" fill="url(#bgGrad)"/>
  <rect x="30" y="30" width="130" height="28" rx="6" fill="#0F172A"/>
  <text x="95" y="49" font-family="Arial" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">CODE: 4-FEPC</text>

  <!-- Graphic -->
  <g transform="translate(190, 40)">
    <!-- Outer Pure Copper Pipe -->
    <rect x="70" y="30" width="80" height="370" rx="8" fill="url(#pureCu)"/>
    
    <!-- Top Copper Cap -->
    <rect x="60" y="20" width="100" height="25" rx="4" fill="#B85B28" stroke="#8C3A10" stroke-width="2"/>
    <text x="110" y="37" font-family="Arial" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">99.9% PURE CU</text>
    
    <polygon points="70,400 150,400 110,440" fill="#8C3A10"/>
  </g>

  <g font-family="Arial" font-size="12" font-weight="600">
    <rect x="410" y="150" width="160" height="40" rx="6" fill="#FFFFFF" stroke="#B85B28"/>
    <text x="490" y="174" text-anchor="middle" fill="#0F172A">99.9% Electrolytic Copper</text>
  </g>
</svg>
