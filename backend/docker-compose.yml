version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: forecast-earthings-backend:latest
    container_name: forecast-earthings-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - WORKERS=${WORKERS:-4}
      - TIMEOUT=120
      - APP_ENV=production
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - forecast_network

  # Optional local MongoDB service for self-hosted / offline setups
  # Run with: docker compose --profile local-db up -d
  mongodb:
    image: mongo:6.0
    container_name: forecast-earthings-mongodb
    restart: unless-stopped
    profiles:
      - local-db
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=forecast_earthings
    volumes:
      - mongodb_data:/data/db
    networks:
      - forecast_network

volumes:
  backend_uploads:
    driver: local
  mongodb_data:
    driver: local

networks:
  forecast_network:
    driver: bridge
