version: "3.8"

services:
  backend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: forecast-earthings-backend:dev
    container_name: forecast-earthings-backend-dev
    command: ["dev"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=development
      - PORT=8000
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - forecast_network

networks:
  forecast_network:
    driver: bridge
