<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="copperGloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8C3A10"/>
      <stop offset="30%" stop-color="#D97736"/>
      <stop offset="50%" stop-color="#F7C4A1"/>
      <stop offset="70%" stop-color="#D97736"/>
      <stop offset="100%" stop-color="#732B08"/>
    </linearGradient>
    <linearGradient id="steelCore" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="600" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Grid -->
  <g opacity="0.15" stroke="#0F172A" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/><line x1="300" y1="0" x2="300" y2="500"/><line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="0" y1="150" x2="600" y2="150"/><line x1="0" y1="350" x2="600" y2="350"/>
  </g>

  <!-- Product Code Badge -->
  <rect x="30" y="30" width="130" height="28" rx="6" fill="#0F172A"/>
  <text x="95" y="49" font-family="Arial" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">CODE: 2-FECB</text>

  <!-- Copper Bonded Electrode Graphics -->
  <g transform="translate(160, 40)">
    <!-- Main Copper Bonded Rod -->
    <rect x="120" y="40" width="40" height="380" rx="6" fill="url(#copperGloss)"/>
    
    <!-- Cutaway Layer Section demonstrating Molecular Bonding -->
    <g transform="translate(10, 160)">
      <!-- Outer Copper Layer -->
      <rect x="100" y="0" width="60" height="120" fill="url(#copperGloss)" rx="4"/>
      <!-- Inner Steel Core -->
      <rect x="110" y="8" width="40" height="104" fill="url(#steelCore)" rx="2"/>
      <text x="130" y="65" font-family="Arial" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">STEEL CORE</text>
    </g>

    <!-- Top Thread Connection -->
    <rect x="125" y="15" width="30" height="25" fill="#B85B28" rx="2"/>
    <line x1="125" y1="20" x2="155" y2="20" stroke="#732B08" stroke-width="2"/>
    <line x1="125" y1="26" x2="155" y2="26" stroke="#732B08" stroke-width="2"/>
    <line x1="125" y1="32" x2="155" y2="32" stroke="#732B08" stroke-width="2"/>

    <!-- Bottom Pointed Tip -->
    <polygon points="120,420 160,420 140,455" fill="#8C3A10"/>
  </g>

  <!-- Feature Annotations -->
  <g font-family="Arial" font-size="12" font-weight="600">
    <rect x="420" y="110" width="150" height="36" rx="6" fill="#FFFFFF" stroke="#D97736"/>
    <text x="495" y="132" text-anchor="middle" fill="#0F172A">250 Micron Cu Coating</text>
    <line x1="320" y1="128" x2="420" y2="128" stroke="#D90429" stroke-width="1.5" stroke-dasharray="3"/>

    <rect x="420" y="210" width="150" height="36" rx="6" fill="#FFFFFF" stroke="#D97736"/>
    <text x="495" y="232" text-anchor="middle" fill="#0F172A">High Tensile Steel Core</text>
    <line x1="310" y1="228" x2="420" y2="228" stroke="#D90429" stroke-width="1.5" stroke-dasharray="3"/>
  </g>
</svg>
